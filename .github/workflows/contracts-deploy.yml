name: contracts-deploy

# Production deployment to Sepolia, triggered by pushing a version tag (v*).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Never cancel an in-flight deploy
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Kill switch: set the CEREMONY_FREEZE repo variable to halt every run.
  freeze-check:
    name: freeze check
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to proceed if frozen
        if: ${{ vars.CEREMONY_FREEZE != '' && vars.CEREMONY_FREEZE != null }}
        # Passed via env, not interpolated into the script: a repo variable is
        # attacker-controlled input the moment an admin account is compromised.
        env:
          FREEZE_REASON: ${{ vars.CEREMONY_FREEZE }}
        run: |
          echo "Ceremony frozen: $FREEZE_REASON"
          exit 1

  # Each environment holds one reviewer and one Shamir share (2-of-3).
  # A share leaves its job as a plain job output, which is not a protected
  # channel.
  reviewer-a:
    name: quorum approval + share A
    needs: freeze-check
    runs-on: ubuntu-latest
    environment: reviewer-a
    outputs:
      share: ${{ steps.release.outputs.share }}
    steps:
      - id: release
        run: echo "share=$DEPLOY_KEY_SHARE" >> "$GITHUB_OUTPUT"
        env:
          DEPLOY_KEY_SHARE: ${{ secrets.DEPLOY_KEY_SHARE }}

  reviewer-b:
    name: quorum approval + share B
    needs: freeze-check
    runs-on: ubuntu-latest
    environment: reviewer-b
    outputs:
      share: ${{ steps.release.outputs.share }}
    steps:
      - id: release
        run: echo "share=$DEPLOY_KEY_SHARE" >> "$GITHUB_OUTPUT"
        env:
          DEPLOY_KEY_SHARE: ${{ secrets.DEPLOY_KEY_SHARE }}

  reviewer-c:
    name: quorum approval + share C
    needs: freeze-check
    runs-on: ubuntu-latest
    environment: reviewer-c
    outputs:
      share: ${{ steps.release.outputs.share }}
    steps:
      - id: release
        run: echo "share=$DEPLOY_KEY_SHARE" >> "$GITHUB_OUTPUT"
        env:
          DEPLOY_KEY_SHARE: ${{ secrets.DEPLOY_KEY_SHARE }}

  deploy:
    name: sepolia (ceremony)
    needs: [freeze-check, reviewer-a, reviewer-b, reviewer-c]
    # 2-of-3: `needs` alone is an AND, so the threshold lives here. GitHub
    # expressions have no arithmetic, hence the explicit pairs. This
    # tolerates a rejection, not silence — a pending approval still blocks.
    if: >-
      always() &&
      needs.freeze-check.result == 'success' &&
      (
        (needs['reviewer-a'].result == 'success' && needs['reviewer-b'].result == 'success') ||
        (needs['reviewer-a'].result == 'success' && needs['reviewer-c'].result == 'success') ||
        (needs['reviewer-b'].result == 'success' && needs['reviewer-c'].result == 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Holds RPC_URL, ETHERSCAN_API_KEY, and CEREMONY_ADMIN_TOKEN (a PAT
    # scoped to Environments:write, used only to push rotated shares back).
    # Deliberately has no reviewers: the human gate is reviewer-a/b/c.
    environment: production
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Compile
        run: npm run compile
      - name: Typecheck
        run: npm run typecheck
      - name: Reconstruct deploy key, deploy, verify, and rotate
        run: npm run ceremony:deploy
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          SHARE_A: ${{ needs['reviewer-a'].outputs.share }}
          SHARE_B: ${{ needs['reviewer-b'].outputs.share }}
          SHARE_C: ${{ needs['reviewer-c'].outputs.share }}
          CEREMONY_ADMIN_TOKEN: ${{ secrets.CEREMONY_ADMIN_TOKEN }}
      - name: Upload deployment manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-${{ github.ref_name }}
          path: contracts/deployments/sepolia.json
          if-no-files-found: error
