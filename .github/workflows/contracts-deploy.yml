name: contracts-deploy

# Production deployment to Sepolia, triggered by pushing a version tag (v*).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Never cancel an in-flight deploy
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Kill switch: set the CEREMONY_FREEZE repo variable to halt every run.
  freeze-check:
    name: freeze check
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to proceed if frozen
        if: ${{ vars.CEREMONY_FREEZE != '' && vars.CEREMONY_FREEZE != null }}
        # Passed via env, not interpolated into the script: a repo variable is
        # attacker-controlled input the moment an admin account is compromised.
        env:
          FREEZE_REASON: ${{ vars.CEREMONY_FREEZE }}
        run: |
          echo "Ceremony frozen: $FREEZE_REASON"
          exit 1

  # Each environment holds one reviewer and one Shamir share (2-of-3).
  # A share leaves its job as a plain job output, which is not a protected
  # channel.
  reviewer-a:
    name: quorum approval + share A
    needs: freeze-check
    runs-on: ubuntu-latest
    environment: reviewer-a
    outputs:
      share: ${{ steps.release.outputs.share }}
    steps:
      - id: release
        # GitHub drops a job output whose value matches a secret ("Skip output
        # ... since it may contain secret"), so the share cannot be emitted
        # verbatim. base64 changes the literal so the output survives; it is
        # transport framing, NOT encryption, and adds no confidentiality.
        run: |
          if [ -z "$DEPLOY_KEY_SHARE" ]; then
            echo "DEPLOY_KEY_SHARE is not set on this environment." >&2
            exit 1
          fi
          echo "share=$(printf '%s' "$DEPLOY_KEY_SHARE" | base64 | tr -d '\n')" >> "$GITHUB_OUTPUT"
        env:
          DEPLOY_KEY_SHARE: ${{ secrets.DEPLOY_KEY_SHARE }}

  reviewer-b:
    name: quorum approval + share B
    needs: freeze-check
    runs-on: ubuntu-latest
    environment: reviewer-b
    outputs:
      share: ${{ steps.release.outputs.share }}
    steps:
      - id: release
        # GitHub drops a job output whose value matches a secret ("Skip output
        # ... since it may contain secret"), so the share cannot be emitted
        # verbatim. base64 changes the literal so the output survives; it is
        # transport framing, NOT encryption, and adds no confidentiality.
        run: |
          if [ -z "$DEPLOY_KEY_SHARE" ]; then
            echo "DEPLOY_KEY_SHARE is not set on this environment." >&2
            exit 1
          fi
          echo "share=$(printf '%s' "$DEPLOY_KEY_SHARE" | base64 | tr -d '\n')" >> "$GITHUB_OUTPUT"
        env:
          DEPLOY_KEY_SHARE: ${{ secrets.DEPLOY_KEY_SHARE }}

  reviewer-c:
    name: quorum approval + share C
    needs: freeze-check
    runs-on: ubuntu-latest
    environment: reviewer-c
    outputs:
      share: ${{ steps.release.outputs.share }}
    steps:
      - id: release
        # GitHub drops a job output whose value matches a secret ("Skip output
        # ... since it may contain secret"), so the share cannot be emitted
        # verbatim. base64 changes the literal so the output survives; it is
        # transport framing, NOT encryption, and adds no confidentiality.
        run: |
          if [ -z "$DEPLOY_KEY_SHARE" ]; then
            echo "DEPLOY_KEY_SHARE is not set on this environment." >&2
            exit 1
          fi
          echo "share=$(printf '%s' "$DEPLOY_KEY_SHARE" | base64 | tr -d '\n')" >> "$GITHUB_OUTPUT"
        env:
          DEPLOY_KEY_SHARE: ${{ secrets.DEPLOY_KEY_SHARE }}

  deploy-ab:
    name: sepolia (ceremony) — A+B
    needs: [freeze-check, reviewer-a, reviewer-b]
    # No `if:` threshold here. A job is skipped when any of its `needs` did not
    # succeed, so this runs exactly when A+B both approved — and it never
    # references reviewer-c, so it does not wait for that reviewer at all. That is
    # what lets two approvals proceed while the third is still pending.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Holds RPC_URL, ETHERSCAN_API_KEY, and CEREMONY_ADMIN_TOKEN (a PAT
    # scoped to Environments:write, used only to push rotated shares back).
    # Deliberately has no reviewers: the human gate is reviewer-a/b/c.
    environment: production
    # Shared by all three pair jobs, so at most one ceremony runs at a time.
    # The guard inside the composite action then makes the losers no-ops.
    concurrency:
      group: ceremony-deploy-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      # Needed by the guard, which reads this run's job list.
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy ceremony
        uses: ./.github/actions/ceremony-deploy
        with:
          share-a: ${{ needs['reviewer-a'].outputs.share }}
          share-b: ${{ needs['reviewer-b'].outputs.share }}
          rpc-url: ${{ secrets.RPC_URL }}
          etherscan-api-key: ${{ secrets.ETHERSCAN_API_KEY }}
          ceremony-admin-token: ${{ secrets.CEREMONY_ADMIN_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  deploy-ac:
    name: sepolia (ceremony) — A+C
    needs: [freeze-check, reviewer-a, reviewer-c]
    # No `if:` threshold here. A job is skipped when any of its `needs` did not
    # succeed, so this runs exactly when A+C both approved — and it never
    # references reviewer-b, so it does not wait for that reviewer at all. That is
    # what lets two approvals proceed while the third is still pending.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Holds RPC_URL, ETHERSCAN_API_KEY, and CEREMONY_ADMIN_TOKEN (a PAT
    # scoped to Environments:write, used only to push rotated shares back).
    # Deliberately has no reviewers: the human gate is reviewer-a/b/c.
    environment: production
    # Shared by all three pair jobs, so at most one ceremony runs at a time.
    # The guard inside the composite action then makes the losers no-ops.
    concurrency:
      group: ceremony-deploy-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      # Needed by the guard, which reads this run's job list.
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy ceremony
        uses: ./.github/actions/ceremony-deploy
        with:
          share-a: ${{ needs['reviewer-a'].outputs.share }}
          share-c: ${{ needs['reviewer-c'].outputs.share }}
          rpc-url: ${{ secrets.RPC_URL }}
          etherscan-api-key: ${{ secrets.ETHERSCAN_API_KEY }}
          ceremony-admin-token: ${{ secrets.CEREMONY_ADMIN_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  deploy-bc:
    name: sepolia (ceremony) — B+C
    needs: [freeze-check, reviewer-b, reviewer-c]
    # No `if:` threshold here. A job is skipped when any of its `needs` did not
    # succeed, so this runs exactly when B+C both approved — and it never
    # references reviewer-a, so it does not wait for that reviewer at all. That is
    # what lets two approvals proceed while the third is still pending.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Holds RPC_URL, ETHERSCAN_API_KEY, and CEREMONY_ADMIN_TOKEN (a PAT
    # scoped to Environments:write, used only to push rotated shares back).
    # Deliberately has no reviewers: the human gate is reviewer-a/b/c.
    environment: production
    # Shared by all three pair jobs, so at most one ceremony runs at a time.
    # The guard inside the composite action then makes the losers no-ops.
    concurrency:
      group: ceremony-deploy-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      # Needed by the guard, which reads this run's job list.
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy ceremony
        uses: ./.github/actions/ceremony-deploy
        with:
          share-b: ${{ needs['reviewer-b'].outputs.share }}
          share-c: ${{ needs['reviewer-c'].outputs.share }}
          rpc-url: ${{ secrets.RPC_URL }}
          etherscan-api-key: ${{ secrets.ETHERSCAN_API_KEY }}
          ceremony-admin-token: ${{ secrets.CEREMONY_ADMIN_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
